- aid: cloudkit:web-services
  name: CloudKit Web Services
  tags:
  - REST
  - Records
  - Zones
  - Subscription
  tags_raw:
  - REST
  - Records
  - Zones
  - Subscriptions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.apple-cloudkit.com/database/1
  humanURL: >-
    https://developer.apple.com/library/archive/documentation/DataManagement/Conceptual/CloudKitWebServicesReference/index.html
  properties:
  - url: >-
      https://developer.apple.com/library/archive/documentation/DataManagement/Conceptual/CloudKitWebServicesReference/index.html
    type: Documentation
  - url: >-
      https://developer.apple.com/library/archive/documentation/DataManagement/Conceptual/CloudKitWebServicesReference/SettingUpWebServices.html
    type: GettingStarted
  - url: >-
      https://developer.apple.com/documentation/cloudkit/obtaining-an-api-token-for-an-icloud-container
    type: APIKeys
  description: >-
    The CloudKit Web Services REST API is structured as /database/1/{container}/{environment}/{database}/{operation},
    where database is one of public, private, or shared and environment is development or production.
    Operations include records lookup, query, modify, delete, zone create/list/delete, subscription create/list/delete,
    asset upload, user info and changes. Calls are authenticated using an API token for user-authenticated
    access (with ckWebAuthToken) or a server-to-server ECDSA key for backend access.
