  properties:
  - url: https://developer.apple.com/documentation/cloudkitjs
    type: Documentation
  description: >-
    CloudKit JS is Apple's JavaScript SDK that wraps the CloudKit Web Services REST API for browser apps.
    It provides Sign in with Apple authentication, container/database/zone access, queries, record operations,
    subscriptions, and asset management.
