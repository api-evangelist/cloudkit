  properties:
  - url: https://developer.apple.com/documentation/cloudkit
    type: Documentation
  description: >-
    The native CloudKit framework for iOS, iPadOS, macOS, tvOS, watchOS, and visionOS. Provides programmatic
    access to CloudKit containers, records, zones, subscriptions, and sharing. Out of band of the web
    services REST surface but shares the same data model.
