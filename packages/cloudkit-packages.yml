note: >-
  Apple ships no CloudKit client library on any language registry for the CloudKit Web Services REST
  surface itself. The first-party distribution is (a) CloudKit JS, served from Apple's own CDN as an
  unversioned script URL, (b) the four CKTool JS packages Apple publishes to npm under the @apple
  scope, and (c) the native CloudKit framework, which ships inside the Apple platform SDKs rather than
  through a package registry. npm searches for "cloudkit" return only third-party wrappers
  (tsl-apple-cloudkit, expo-cloudkit, capacitor-cloudkit) — none are Apple's and none are recorded here.
