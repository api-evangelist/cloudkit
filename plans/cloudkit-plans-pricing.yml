note: >-
  Apple publishes NO usage-priced plans for CloudKit. There is no per-request, per-GB or per-container
  price list, no free-tier quota table on any live Apple page, and no upgrade path to buy more capacity
  as a developer. Access is gated by Apple Developer Program membership instead, so the only published
  figure that touches CloudKit is the membership fee. The historical CloudKit public-database quota
  chart (asset/database/transfer allowances scaling with app users) is no longer served on
  developer.apple.com/icloud/cloudkit/ — the only quantitative claim left there is "get up to 1PB of
  storage for your app's public data", with no tier structure behind it. plan_count is 0 because those
  are memberships, not API plans; the memberships are recorded below as context, not as plans.
